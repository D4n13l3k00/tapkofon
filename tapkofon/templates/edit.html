{% extends "base.html" %}{% block content %}<h1>Изменить сообщение</h1><form action="/chat/{{ chat }}/edit_message" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="msg_id" value="{{ id }}"><label for="text">Текст</label><textarea id="text" name="text" rows="5" cols="18">{{ text }}</textarea><button type="submit">Сохранить изменения</button></form><p><a href="/chat/{{ chat }}">Отмена</a></p>{% endblock %}
