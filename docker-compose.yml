services:
  tapkofon:
    build: .
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./session:/app/session
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
